name: Dispatch Exploration
description: Collect completed explorations and dispatch new ones
icon: compass

steps:
  - action: find_and_tap
    template: exploration_tab.png
    description: Open Exploration tab

  - action: wait
    seconds: 1

  - action: find_and_tap
    template: collect_all_btn.png
    description: Collect completed explorations
    optional: true

  - action: wait
    seconds: 1

  - action: find_and_tap
    template: dispatch_btn.png
    description: Dispatch new exploration
    optional: true

  - action: find_and_tap
    template: confirm_btn.png
    description: Confirm dispatch
    optional: true

  - action: wait
    seconds: 1

  - action: tap_back
    description: Return to main screen
