name: Claim Daily Rewards
description: Collects login rewards, VIP chest, and daily quest rewards
icon: gift

steps:
  - action: find_and_tap
    template: daily_reward_popup.png
    description: Tap daily reward popup if visible
    optional: true

  - action: wait
    seconds: 1

  - action: find_and_tap
    template: claim_btn.png
    description: Tap claim button
    optional: true

  - action: wait
    seconds: 2

  - action: tap_back
    description: Close reward screen

  - action: find_and_tap
    template: vip_chest_icon.png
    description: Open VIP chest
    optional: true

  - action: find_and_tap
    template: claim_free_btn.png
    description: Claim free VIP chest
    optional: true

  - action: wait
    seconds: 1

  - action: tap_back
    description: Return to main screen
