  ignore_badge: true
- action: wait
  description: ''
  seconds: 1
- action: find_and_tap
  description: Tap claim button
  template: ''
  optional: true
- action: wait
  description: ''
  seconds: 2
- action: tap_back
  description: Close reward screen
